name: CodeRabbit → Linear Issue (Auto)

# Quando CodeRabbit posta/edita o walkthrough (resumo final do review),
# cria UM issue consolidado no Linear com todos os findings.
# Ciclo contínuo: PR → Review → Issue → Fix → Re-review → Novo Issue → Fix → ...até resolver

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  create-linear-issue:
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'coderabbitai[bot]' &&
      contains(github.event.comment.body, 'walkthrough_start')
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar review completo
        run: sleep 600

      - name: Verificar e criar issue no Linear
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const prNumber = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const walkthrough = context.payload.comment.body;
            const walkthroughCommentId = context.payload.comment.id;

            // Verificar se o walkthrough indica problemas encontrados
            const hasFindings = walkthrough.includes('⚠️') ||
              walkthrough.includes('🔴') ||
              walkthrough.includes('Changes requested') ||
              walkthrough.includes('needs attention') ||
              walkthrough.length > 2000;

            if (!hasFindings) {
              console.log('Walkthrough sem findings significativos. Pulando.');
              return;
            }

            // Deduplicação por walkthrough (não por PR inteiro)
            // Permite o loop: review → issue → fix → re-review → novo issue
            // Só bloqueia se já pedimos issue para ESTE MESMO walkthrough comment
            const { data: prComments } = await github.rest.issues.listComments({
              owner, repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const marker = `<!-- walkthrough-${walkthroughCommentId} -->`;
            const alreadyRequested = prComments.some(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes(marker)
            );

            if (alreadyRequested) {
              console.log(`Issue já solicitado para este walkthrough (comment ${walkthroughCommentId}). Pulando.`);
              return;
            }

            // Contar ciclo de review (quantas vezes já pedimos issue nesse PR)
            const reviewCycle = prComments.filter(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('@coderabbitai create a single linear issue')
            ).length + 1;

            // Pedir pro CodeRabbit criar issue consolidado para este ciclo
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: prNumber,
              body: [
                marker,
                `@coderabbitai create a single linear issue that consolidates ALL review findings from this PR.`,
                '',
                `**Review cycle #${reviewCycle}** — This is ${reviewCycle === 1 ? 'the initial review' : 'a follow-up review after fixes'}.`,
                '',
                'Include:',
                '- All code review comments and suggestions from this review cycle',
                '- Files affected with line references',
                '- Priority based on severity of issues found',
                reviewCycle > 1 ? '- Note which issues are NEW vs recurring from previous reviews' : '',
              ].filter(Boolean).join('\n'),
            });

            console.log(`Issue consolidado solicitado no Linear (ciclo #${reviewCycle}).`);
