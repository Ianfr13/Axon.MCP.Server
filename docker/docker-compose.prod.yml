# Axon MCP Server — Production Deployment
# Usage: docker compose -f docker/docker-compose.prod.yml up -d
# Run from repo root: /root/axon/Axon.MCP.Server

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: axon-prod-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - axon_prod_postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axon-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: axon-prod-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6389:6379"
    volumes:
      - axon_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - axon-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ghcr.io/ianfr13/axon-mcp-server:latest
    container_name: axon-prod-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8080 --workers 4
    ports:
      - "127.0.0.1:8090:8080"
    expose:
      - "9090"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-axon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-axon_mcp}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      PYTHONPATH: /app
    volumes:
      - axon_prod_cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - axon-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  mcp-server:
    image: ghcr.io/ianfr13/axon-mcp-server:latest
    container_name: axon-prod-mcp-server
    command: python -m src.mcp_server.main
    ports:
      - "127.0.0.1:8091:8001"
    expose:
      - "9090"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-axon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-axon_mcp}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PYTHONPATH: /app
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8001
    volumes:
      - axon_prod_cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - axon-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    image: ghcr.io/ianfr13/axon-mcp-server:latest
    container_name: axon-prod-worker
    command: celery -A src.workers.celery_app:celery_app worker --loglevel=info --concurrency=1 --queues=repository_sync,file_parsing,embeddings,default
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-axon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-axon_mcp}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      PYTHONPATH: /app
    volumes:
      - axon_prod_cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axon-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  enrichment-worker:
    image: ghcr.io/ianfr13/axon-mcp-server:latest
    container_name: axon-prod-enrichment-worker
    command: celery -A src.workers.celery_app:celery_app worker --loglevel=info --concurrency=8 --queues=ai_enrichment,repository_aggregation
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-axon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-axon_mcp}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      PYTHONPATH: /app
    volumes:
      - axon_prod_cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axon-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  beat:
    image: ghcr.io/ianfr13/axon-mcp-server:latest
    container_name: axon-prod-beat
    command: celery -A src.workers.celery_app:celery_app beat --loglevel=info
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-axon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-axon_mcp}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axon-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ui:
    image: ghcr.io/ianfr13/axon-mcp-ui:latest
    container_name: axon-prod-ui
    ports:
      - "127.0.0.1:8092:80"
    environment:
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axon-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "component=frontend"
      - "app=axon-mcp-ui"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: axon-prod-postgres-exporter
    expose:
      - "9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-axon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-axon_mcp}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - axon-network
    restart: always

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: axon-prod-redis-exporter
    expose:
      - "9121"
    environment:
      - REDIS_ADDR=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - axon-network
    restart: always

volumes:
  axon_prod_postgres_data:
    driver: local
  axon_prod_redis_data:
    driver: local
  axon_prod_cache:
    driver: local

networks:
  axon-network:
    driver: bridge
